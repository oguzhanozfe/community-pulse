name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - name: demo (replay mode, no key, no model)
        run: python -m community_pulse demo --out out/demo && cmp out/demo/dashboard.html examples/helldivers2/dashboard.html
      - name: published dashboard matches the example
        run: cmp docs/index.html examples/helldivers2/dashboard.html
